<style>
*{box-sizing:border-box}
html{background:#050506}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 20px;font-family:Manrope,Inter,system-ui,sans-serif;color:#F4F4F5;background:radial-gradient(60% 40% at 20% 10%,rgba(255,255,255,.10),transparent 70%),radial-gradient(50% 40% at 90% 90%,rgba(190,190,205,.07),transparent 70%),#050506;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{width:100%;max-width:440px}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:34px;animation:up .7s ease-out both}
.brand img{width:72px;height:72px;display:block}
.brand h1{margin:14px 0 6px;font-size:30px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:#8E8E96;font-size:15px}
.list{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border-radius:18px;text-decoration:none;color:#F4F4F5;background:#0C0C0E;border:1px solid rgba(255,255,255,.18);transition:transform .35s cubic-bezier(.16,.84,.3,1),background-color .3s,color .3s,box-shadow .3s;animation:up .7s ease-out both}
.opt:nth-child(1){animation-delay:.1s}.opt:nth-child(2){animation-delay:.2s}.opt:nth-child(3){animation-delay:.3s}
.opt .t{display:block;font-size:19px;font-weight:700}
.opt .d{display:block;margin-top:2px;font-size:14px;color:#8E8E96;transition:color .3s}
.opt svg{flex:none;transition:transform .3s}
.opt:hover,.opt:focus-visible{background:#FFFFFF;color:#050506;transform:translateY(-3px);box-shadow:0 24px 50px -28px rgba(255,255,255,.35);outline:none}
.opt:hover .d,.opt:focus-visible .d{color:#55555C}
.opt:hover svg{transform:translateX(4px)}
.opt.main{background:linear-gradient(135deg,#FFFFFF,#B4B4BE);color:#050506;border-color:transparent}
.opt.main .d{color:#3C3C42}
.opt.main:hover{filter:brightness(1.06)}
.foot{margin-top:28px;text-align:center;font-size:13px;color:#8E8E96}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
